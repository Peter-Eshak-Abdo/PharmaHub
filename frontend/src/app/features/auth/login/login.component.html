<div class="auth-page-wrapper" dir="rtl">
  <!-- Decorative Background Blur -->
  <div class="bg-blur blur-top"></div>
  <div class="bg-blur blur-bottom"></div>

  <div class="auth-card-container">
    <div class="auth-header">
      <div class="icon-badge">
        <span class="material-symbols-outlined">health_and_safety</span>
      </div>
      <h2>مرحباً بعودتك</h2>
      <p>سجّل الدخول للوصول إلى حسابك الطبي.</p>
    </div>

    <div class="auth-card">
      <div *ngIf="errorMessage" class="alert-error">
        <span class="material-symbols-outlined">error</span>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="login-email">البريد الإلكتروني</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon right-icon">mail</span>
            <input 
              id="login-email"
              type="email" 
              formControlName="email" 
              placeholder="name@example.com"
              class="rtl-input"
            />
          </div>
          <div *ngIf="submitted && f['email'].errors" class="error-msg">
            <small *ngIf="f['email'].errors['required']">البريد الإلكتروني مطلوب</small>
            <small *ngIf="f['email'].errors['email']">يرجى إدخال بريد إلكتروني صالح</small>
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">كلمة المرور</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon right-icon">lock</span>
            <input 
              id="login-password"
              [type]="hidePassword ? 'password' : 'text'" 
              formControlName="password" 
              placeholder="••••••••"
              class="rtl-input"
            />
            <button type="button" class="password-toggle" (click)="hidePassword = !hidePassword">
              <span class="material-symbols-outlined">
                {{ hidePassword ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
          <div *ngIf="submitted && f['password'].errors" class="error-msg">
            <small *ngIf="f['password'].errors['required']">كلمة المرور مطلوبة</small>
            <small *ngIf="f['password'].errors['minlength']">كلمة المرور يجب أن لا تقل عن 6 أحرف</small>
          </div>
        </div>

        <button type="submit" class="btn-primary" [disabled]="loading">
          <span *ngIf="!loading">تسجيل الدخول</span>
          <span *ngIf="loading">جاري تسجيل الدخول...</span>
          <span class="material-symbols-outlined btn-icon">arrow_back</span>
        </button>
      </form>
    </div>

    <div class="auth-footer">
      ليس لديك حساب؟ <a routerLink="/auth/register">إنشاء حساب جديد</a>
    </div>
  </div>
</div>
