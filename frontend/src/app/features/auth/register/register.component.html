<div class="auth-page-wrapper">
  <div class="bg-blur blur-top"></div>
  <div class="bg-blur blur-bottom"></div>

  <div class="auth-card-container">

    <div class="auth-header">
      <div class="icon-badge">
        <span class="material-symbols-outlined">health_and_safety</span>
      </div>
      <h2>Join Our Network</h2>
      <p>Set up your account to get started.</p>
    </div>

    <div class="auth-card">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="role-segmented-control">
          <button
            type="button"
            class="role-btn"
            [class.active]="registerForm.get('role')?.value === 'patient'"
            (click)="setRole('patient')">
            Patient
          </button>
          <button
            type="button"
            class="role-btn"
            [class.active]="registerForm.get('role')?.value === 'doctor'"
            (click)="setRole('doctor')">
            Doctor
          </button>
        </div>

        <div class="form-group">
          <label for="register-email">EMAIL ADDRESS</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon">mail</span>
            <input
              id="register-email"
              type="email"
              formControlName="email"
              placeholder="jane@example.com"
            />
          </div>
          <div *ngIf="submitted && f['email'].errors" class="error-msg">
            <small *ngIf="f['email'].errors['required']">Email is required</small>
            <small *ngIf="f['email'].errors['email']">Email must be valid</small>
          </div>
        </div>

        <div class="form-group">
          <label for="register-password">PASSWORD</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon">lock</span>
            <input
              id="register-password"
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              placeholder="••••••••"
            />
            <button type="button" class="password-toggle" (click)="hidePassword = !hidePassword">
              <span class="material-symbols-outlined">
                {{ hidePassword ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
          <div *ngIf="submitted && f['password'].errors" class="error-msg">
            <small *ngIf="f['password'].errors['required']">Password is required</small>
            <small *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</small>
          </div>
        </div>

        <button type="submit" class="btn-primary">
          <span>Create Account</span>
          <span class="material-symbols-outlined btn-icon">arrow_forward</span>
        </button>
      </form>
    </div>

    <div class="auth-footer">
      Already have an account? <a routerLink="/auth/login">Log in</a>
    </div>
  </div>
</div>
