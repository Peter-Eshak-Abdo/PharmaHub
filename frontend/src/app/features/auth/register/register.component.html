<div class="register-container">
  <h2>Register</h2>
  <form (ngSubmit)="onSubmit()">
    <div>
      <label>Email</label>
      <input title="email" type="email" [(ngModel)]="email" name="email" required>
    </div>
    <div>
      <label>Password</label>
      <input title="password" type="password" [(ngModel)]="password" name="password" required>
    </div>
    <div>
      <label>Role</label>
      <select title="role" name="role" required>
        <option value="patient">Patient</option> 
        <option value="doctor">Doctor</option> 
      </select>
    </div>
    <button type="submit">Register</button>
  </form>
</div>
