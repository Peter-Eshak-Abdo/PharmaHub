<!-- features/appointments/review-form/review-form.component.html -->
<div class="relative">
  <button *ngIf="!showForm" (click)="showForm = true"
    class="text-sm text-teal-600 hover:text-teal-700 font-semibold border border-teal-600 hover:bg-teal-50 px-4 py-1.5 rounded-lg transition-colors">
    تقييم
  </button>

  <div *ngIf="showForm"
    class="absolute top-0 right-0 sm:right-full sm:mr-4 w-72 bg-white p-5 rounded-lg shadow-lg border border-slate-200 z-10">
    <form [formGroup]="reviewForm" (ngSubmit)="submitReview()" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-800 mb-2">التقييم (1-5)</label>
        <input title="Ratting" type="number" formControlName="rating" min="1" max="5"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 outline-none transition-colors text-slate-800" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-800 mb-2">تعليق</label>
        <textarea title="Comment" formControlName="comment" rows="2"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-600/20 focus:border-teal-600 outline-none transition-colors resize-none text-slate-800"></textarea>
      </div>

      <div class="flex gap-2">
        <button type="submit" [disabled]="reviewForm.invalid"
          class="flex-1 bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold py-2 px-3 rounded-lg transition-colors disabled:opacity-50 shadow-sm">
          حفظ
        </button>
        <button type="button" (click)="showForm = false"
          class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold py-2 px-3 rounded-lg transition-colors">
          إلغاء
        </button>
      </div>
    </form>
  </div>
</div>
